name: Revisor de escrita

on:
  push:
    paths: ["textos/**.md", "ferramentas/revisor.py"]
  pull_request:
    paths: ["textos/**.md"]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar textos
        run: |
          arquivos=$(find textos -name '*.md' ! -name 'LEIAME.md')
          if [ -z "$arquivos" ]; then echo "Nenhum texto para revisar."; exit 0; fi
          python ferramentas/revisor.py $arquivos
